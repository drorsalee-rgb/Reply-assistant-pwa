<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17261f" />
<title>Yoriki — הפרכת פייק</title>
<meta property="og:title" content="Yoriki — הפרכת פייק" />
<meta property="og:description" content="הפרכה מוכנה לפוסט מטעה, בלחיצה אחת." />
<meta property="og:type" content="website" />
<link rel="manifest" href="../manifest.json" />
<link rel="apple-touch-icon" href="../icons/icon-192.png?v=2" />
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1e25;
    --bg-soft:#123642;
    --paper:#eaf6f8;
    --gold:#28c2e0;
    --good:#5f9c7d;
    --warn:#d97a4b;
    --warn-bg:#3a2a1c;
    --card-bg:#123642;
    --card-header-bg:#0c2730;
    --card-border:#1f5b66;
    --accent:#28c2e0;
    --accent-ink:#06222b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-soft), transparent),
      var(--bg);
    /* The layout used to be pinned to the viewport with overflow:hidden, and
       anything that did not fit was CUT OFF rather than scrolled to — the red
       report button sat below the fold on most phones, and inside WhatsApp's
       in-app browser, whose toolbar eats height that 100dvh still counts, even
       on a large iPhone. Fixed-height also forced the reply font down to stay
       inside the card, which made it too small to read.
       The page now flows: content decides its height and the document scrolls,
       which every browser — in-app ones included — handles correctly. */
    min-height:100vh;
    min-height:100dvh;
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .screen{
    width:100%;
    max-width:420px;
    min-height:100vh;
    min-height:100dvh;
    /* WhatsApp's in-app browser floats its address bar OVER the page instead of
       reserving space for it, so whatever sits last — the red report button —
       ends up underneath it even once the page scrolls. env(safe-area-inset-*)
       does not cover an app's own chrome, so reserve the room outright. */
    padding:20px 20px calc(76px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
    gap:14px;
    /* Safety valve. The layout is sized to the viewport, and when the parts add
       up to more than fits, body{overflow:hidden} used to CLIP the remainder:
       on a 812px-tall phone the red report button ended 35px below the fold and
       on a 780px one 67px below, unreachable with no scrollbar to hint at it.
       Everything must stay reachable on every screen, so the column scrolls
       rather than swallowing its own bottom. */
  }
  button{
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    border:0;
    cursor:pointer;
    color:inherit;
  }

  .banner{
    display:flex;
    align-items:center;
    gap:8px;
    flex:none;
    padding:11px 14px;
    border-radius:12px;
    background:var(--warn-bg);
    color:#f0b48a;
    font-size:15px;
    font-weight:700;
  }
  .banner .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--warn);
    flex:none;
  }

  .section-label{
    flex:none;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    letter-spacing:0.02em;
    color:#8aa097;
  }
  .social-icon{ display:inline-flex; }
  .social-icon svg{ width:17px; height:17px; fill:currentColor; }

  .context-wrap{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:none;
    min-height:0;
  }
  .context{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:21px;
    line-height:1.55;
    font-weight:500;
    color:#d7e7ea;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:14px;
    padding:14px 16px;
    flex:none;
    /* Capped so a long summary cannot push the reply and the buttons off the
       screen. It is context; the reply below is the thing being used. */
    max-height:18vh;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .context .placeholder{ color:#7ea3aa; font-style:italic; }
  /* The summary is context; the reply below is the thing being used. Cap the
     summary so a long one cannot squeeze the reply into a few lines. */

  .card-wrap{ position:relative; display:flex; flex-direction:column; flex:none; }
  /* Without this a reader cannot tell there is more text below — half of the
     original "I can't scroll" report was simply not knowing. */
  .card-wrap .scroll-hint{
    position:absolute; left:0; right:0; bottom:0;
    height:46px; border-radius:0 0 18px 18px;
    background:linear-gradient(to bottom, rgba(18,54,66,0), var(--card-bg) 80%);
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:6px; font-size:13px; color:#8aa097;
    pointer-events:none; opacity:0; transition:opacity .18s ease;
  }
  .card-wrap.can-scroll .scroll-hint{ opacity:1; }
  .card-wrap.scrolled-to-end .scroll-hint{ opacity:0; }
  .card{
    position:relative;
    background:var(--card-bg);
    color:var(--paper);
    border-radius:18px;
    border:1.5px solid var(--card-border);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 18px 40px -12px rgba(0,0,0,0.55);
  }
  .card-header{
    flex:none;
    padding:14px 18px;
    background:var(--card-header-bg);
    border-bottom:1px solid var(--card-border);
    text-align:center;
    font-weight:700;
    font-size:17px;
    color:#bfe6ee;
  }
  .quote-text{
    /* No inner scrolling and no shrinking: the card grows to its text and the
       page scrolls. Older volunteers need this readable more than the screen
       needs to hold everything at once. */
    font-size:24px;
    line-height:1.6;
    font-weight:600;
    margin:0;
    padding:22px 20px;
    color:#eaf6f8;
    /* The font stays at 24px — shrinking it to fit made it unreadable for
       older volunteers. A long reply scrolls inside the card instead, so the
       card cannot grow until it pushes the buttons off the screen.
       This inner scroll is only usable now that a vertical drag is no longer
       swallowed by the sideways swipe handler; that was the original
       "I can't scroll" report. */
    max-height:27vh;
    overflow-y:auto;
    overscroll-behavior:contain;
  }

  .quote-text.placeholder{ color:#7ea3aa; font-style:italic; font-size:17px; font-weight:500; }

  /* The controls used to stack seven full-width rows and take ~320px, which is
   what pushed the report button off the screen. Same functions, fewer rows:
   the two closing buttons share a line, and the paste hint carries the source
   link instead of owning a line of its own. */
.actions{ display:flex; flex-direction:column; gap:8px; flex:none; }
  .closing-row{ display:flex; gap:8px; }
  .closing-row .btn-decline{ flex:1; }
  /* The report button stays the wider half: it was made prominent on purpose. */
  .closing-row .btn-report{ flex:1.4; }
  .btn-accept{
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    font-size:17px;
    padding:15px 20px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s ease, background .15s ease, opacity .2s ease;
  }
  .btn-accept:active{ transform:scale(0.97); }
  .btn-accept.done{ background:var(--good); color:#0e1f15; }
  .btn-accept:disabled{ background:#3a4d52; color:#7c9499; pointer-events:none; }
  .hint{ margin:0; text-align:center; font-size:13px; color:#8aa097; line-height:1.45; }
  .hint a{ color:var(--gold); text-decoration:underline; font-weight:700; }
  .source[hidden], #hintSep[hidden]{ display:none; }
  .hint a{ color:var(--gold); text-decoration:underline; font-weight:700; }
  .source a{ color:var(--gold); text-decoration:underline; font-weight:600; }
  .btn-decline{
    background:transparent;
    border:1px solid #3a4d52;
    color:#8aa097;
    font-weight:600;
    font-size:15px;
    padding:10px 16px;
    border-radius:14px;
  }
  .btn-decline:active{ transform:scale(0.97); }
  .btn-rephrase{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    color:#bfe6ee;
    font-weight:600;
    font-size:14.5px;
    padding:8px 16px;
    border-radius:14px;
  }
  .btn-rephrase:active{ transform:scale(0.97); }
  .rephrase-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .wording-counter{ font-size:13.5px; color:#8aa097; min-width:64px; text-align:center; }
  .length-badge{
    margin:6px 0 0;
    text-align:center;
    font-size:12.5px;
    color:#8aa097;
  }
  .length-badge.over{ color:#f0946a; font-weight:700; }
  .gender-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:14px;
    color:#8aa097;
  }
  .gender-btn{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    color:#bfe6ee;
    font-weight:600;
    font-size:14px;
    padding:6px 16px;
    border-radius:12px;
  }
  .gender-btn.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }

  .btn-report{
    background:#c0392b;
    border:0;
    color:#fff;
    font-weight:700;
    font-size:15.5px;
    padding:10px 16px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-report:active{ transform:scale(0.97); }
  .btn-report:disabled{ background:#4a3a38; color:#9a8a88; pointer-events:none; }

  /* Report sheet — sits over the card so the wording stays in view behind it. */
  .report-overlay{
    position:fixed; inset:0;
    background:rgba(4,16,20,0.72);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:20;
  }
  .report-overlay[hidden]{ display:none; }
  .report-sheet{
    width:100%; max-width:420px;
    background:var(--card-bg);
    border:1.5px solid var(--card-border);
    border-radius:20px 20px 0 0;
    padding:18px 18px 22px;
    max-height:88vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:12px;
  }
  .report-title{ margin:0; font-size:18px; font-weight:700; color:#eaf6f8; }
  .report-sub{ margin:0; font-size:13.5px; color:#8aa097; }
  .report-option{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    padding:12px 14px;
    font-size:15.5px; font-weight:500;
    color:#d7e7ea;
    text-align:right;
    width:100%;
  }
  .report-option.selected{
    background:rgba(40,194,224,0.16);
    border-color:var(--accent);
    color:#eaf6f8;
  }
  .report-option .tick{ flex:none; width:18px; color:var(--accent); font-weight:800; }
  .report-note{
    width:100%;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    padding:12px 14px;
    color:#eaf6f8;
    font-family:inherit;
    font-size:15px;
    resize:vertical;
    min-height:64px;
  }
  .report-note::placeholder{ color:#7ea3aa; }
  .report-actions{ display:flex; gap:10px; }
  .report-actions button{ flex:1; padding:13px 16px; border-radius:14px; font-weight:700; font-size:15px; }
  .btn-send{ background:var(--accent); color:var(--accent-ink); }
  .btn-send:disabled{ background:#3a4d52; color:#7c9499; pointer-events:none; }
  .btn-cancel{ background:transparent; border:1px solid #3a4d52; color:#8aa097; }

  @media (max-height: 700px){
    .screen{ padding:12px 16px calc(76px + env(safe-area-inset-bottom, 0px)); gap:10px; }
    .card-wrap{ min-height:170px; }
    .btn-accept{ padding:13px 20px; }
    .btn-decline{ padding:9px 20px; }
    .context{ font-size:18px; }
  }
</style>
</head>
<body>

<div class="screen">

  <div class="banner">
    <span class="dot"></span>
    <span>זוהה פוסט מטעה — הנה הפרכה מוכנה</span>
  </div>

  <div class="context-wrap" id="contextWrap">
    <p class="section-label">
      <span>הפוסט שאליו מגיבים</span>
      <span class="social-icon" id="summaryIcon" hidden></span>
    </p>
    <div class="context" id="context">
      <span class="placeholder">טוען פרטי הפוסט…</span>
    </div>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-header">ההפרכה שלך</div>
      <p class="quote-text placeholder" id="quoteText">טוען…</p>
    </div>
    <div class="scroll-hint" aria-hidden="true">גללו לקריאת ההמשך ↓</div>
    <p class="length-badge" id="lengthBadge" hidden></p>
  </div>

  <div class="actions">
    <button class="btn-accept" id="acceptBtn" disabled>
      <span id="acceptLabel">העתק ופתח</span>
      <span class="social-icon" id="socialIcon" hidden></span>
    </button>
    <div class="gender-row" id="genderRow" hidden>
      <span>הניסוח בלשון:</span>
      <button class="gender-btn" id="genderMale" data-gender="male">זכר</button>
      <button class="gender-btn" id="genderFemale" data-gender="female">נקבה</button>
    </div>
    <div class="rephrase-row" id="rephraseBtn" hidden>
      <button class="btn-rephrase" id="prevWording">‹ הקודם</button>
      <span class="wording-counter" id="wordingCounter"></span>
      <button class="btn-rephrase" id="nextWording">נסח אחר ›</button>
    </div>
    <p class="hint" id="hint">הדבק את ההפרכה כתגובה אחרי פתיחה<span id="hintSep" hidden> · </span><span class="source" id="source" hidden></span></p>
    <div class="closing-row">
      <button class="btn-decline" id="declineBtn">לא, תודה</button>
      <button class="btn-report" id="reportBtn">
        <span aria-hidden="true">⚠</span><span id="reportLabel">יש בעיה עם זה</span>
      </button>
    </div>
  </div>
</div>

<div class="report-overlay" id="reportOverlay" hidden>
  <div class="report-sheet">
    <p class="report-title">מה הבעיה?</p>
    <p class="report-sub">אפשר לסמן יותר מאחד. הדיווח מגיע לצוות שבודק את הפייקים.</p>
    <button class="report-option" data-reason="post_wont_open">
      <span class="tick"></span><span>הפוסט המקורי לא נפתח</span>
    </button>
    <button class="report-option" data-reason="replies_disabled">
      <span class="tick"></span><span>הפוסט המקורי לא מאפשר תגובות</span>
    </button>
    <button class="report-option" data-reason="not_fake">
      <span class="tick"></span><span>זה לא באמת פייק</span>
    </button>
    <button class="report-option" data-reason="reply_mismatch">
      <span class="tick"></span><span>התגובה לא מתאימה לפוסט</span>
    </button>
    <textarea class="report-note" id="reportNote" maxlength="1000"
      placeholder="משהו אחר? כתבו כאן (לא חובה)"></textarea>
    <div class="report-actions">
      <button class="btn-cancel" id="reportCancel">ביטול</button>
      <button class="btn-send" id="reportSend" disabled>שליחה</button>
    </div>
  </div>
</div>

<script>
/* ---------- config ---------- */

const FIRESTORE_BASE = 'https://firestore.googleapis.com/v1/projects/torino-social/databases/(default)/documents/';
const FIRESTORE_DOC_URL = FIRESTORE_BASE + 'fake-hunting-messages/';
const VARIANTS_DOC_URL = FIRESTORE_BASE + 'debunk-variants/';
const FIREBASE_API_KEY = 'AIzaSyCb27ww2YnTDCjzrQw96w39EvyVisPPY9E';
const EVENTS_URL = 'https://pwa-events-658282975646.europe-west1.run.app/e';

function safeDecode(value){
  if(!value) return value;
  let result = value;
  for(let i = 0; i < 3; i++){
    let decoded;
    try{ decoded = decodeURIComponent(result); }catch(e){ break; }
    if(decoded === result) break;
    result = decoded;
  }
  return result;
}

const params = new URLSearchParams(window.location.search);
const messageId = safeDecode(
  params.get('message_id') || params.get('id') || params.get('document_id')
);

const els = {
  context: document.getElementById('context'),
  summaryIcon: document.getElementById('summaryIcon'),
  cardWrap: document.querySelector('.card-wrap'),
  socialIcon: document.getElementById('socialIcon'),
  card: document.getElementById('card'),
  quoteText: document.getElementById('quoteText'),
  acceptBtn: document.getElementById('acceptBtn'),
  acceptLabel: document.getElementById('acceptLabel'),
  hint: document.getElementById('hint'),
  source: document.getElementById('source'),
  declineBtn: document.getElementById('declineBtn'),
  rephrase: document.getElementById('rephraseBtn'),
  prevWording: document.getElementById('prevWording'),
  nextWording: document.getElementById('nextWording'),
  wordingCounter: document.getElementById('wordingCounter'),
  length: document.getElementById('lengthBadge'),
  genderRow: document.getElementById('genderRow'),
  genderMale: document.getElementById('genderMale'),
  genderFemale: document.getElementById('genderFemale'),
  reportBtn: document.getElementById('reportBtn'),
  reportOverlay: document.getElementById('reportOverlay'),
  reportNote: document.getElementById('reportNote'),
  reportCancel: document.getElementById('reportCancel'),
  reportSend: document.getElementById('reportSend')
};

const PAGE = { claim: '', postSummary: '', debunk: '', postUrl: null, sourceUrl: null, sourceShort: null, network: null };

// Each recipient's link carries a variant index, so the people drawn for one
// alert don't all post the identical sentence.
const variantIndex = parseInt(params.get('v'), 10);
let variantSets = { male: [], female: [] };
let variants = [];
let variantAt = 0;
let gender = null;

/* ---------- usage counters (same service as the main PWA) ---------- */

const visitorToken = (() => {
  const fresh = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  try{
    let t = localStorage.getItem('vid');
    if(!t){ t = fresh(); localStorage.setItem('vid', t); }
    return t;
  }catch(e){ return ''; }
})();

function track(event){
  if(!messageId) return;
  try{
    // The variant index identifies which recipient this link was sent to, so
    // the stats can say who opened an alert — not just how many did.
    const slot = Number.isInteger(variantIndex) && variantIndex >= 0 ? variantIndex : 0;
    const payload = JSON.stringify({
      event,
      document_id: 'debunk:' + messageId,
      recipient: String(slot),
      session: visitorToken
    });
    if(navigator.sendBeacon){
      navigator.sendBeacon(EVENTS_URL, new Blob([payload], { type: 'text/plain' }));
    } else {
      fetch(EVENTS_URL, { method: 'POST', body: payload, keepalive: true }).catch(() => {});
    }
  }catch(e){}
}

/* ---------- network icon ---------- */

const SOCIAL_ICONS = {
  x: 'M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z',

function networkFromUrl(url){
  let host;
  try{ host = new URL(url).hostname.replace(/^www\./, '').toLowerCase(); }
  catch(e){ return null; }
  if(/(^|\.)(x|twitter)\.com$/.test(host) || host === 't.co') return 'x';
  if(/(^|\.)(facebook\.com|fb\.com|fb\.watch)$/.test(host)) return 'facebook';
  if(/(^|\.)instagram\.com$/.test(host)) return 'instagram';
  if(/(^|\.)(tiktok\.com|vt\.tiktok\.com)$/.test(host)) return 'tiktok';
  if(/(^|\.)(youtube\.com|youtu\.be)$/.test(host)) return 'youtube';
  return null;
}

function renderNetworkIcons(){
  const network = PAGE.network;
  const targets = [els.socialIcon, els.summaryIcon];
  if(!network || !SOCIAL_ICONS[network]){
    targets.forEach(el => { el.hidden = true; });
    return;
  }
  const svg = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="' + SOCIAL_ICONS[network] + '"/></svg>';
  targets.forEach(el => { el.innerHTML = svg; el.hidden = false; });
}

/* ---------- content ---------- */

// The orchestrator writes one blob of text:
//   "[FAKE CLAIM ALERT] <the claim>\n\nDebunk: <the rebuttal>\n<link>"
// The claim becomes the summary, the rebuttal becomes the suggested reply.
function splitClaimAndDebunk(text){
  const raw = String(text || '');
  const withoutLinks = raw.replace(/https?:\/\/\S+/g, '').trim();
  const match = withoutLinks.match(/^([\s\S]*?)\n+\s*Debunk\s*:\s*([\s\S]+)$/i);
  if(!match){
    return { claim: withoutLinks.replace(/^\[.*?\]\s*/, '').trim(), debunk: '' };
  }
  return {
    claim: match[1].replace(/^\[.*?\]\s*/, '').trim(),
    debunk: match[2].trim()
  };
}

function field(fields, name){
  return fields && fields[name] && fields[name].stringValue ? fields[name].stringValue : null;
}

async function loadMessage(){
  if(!messageId) return null;
  try{
    const res = await fetch(FIRESTORE_DOC_URL + encodeURIComponent(messageId) + '?key=' + FIREBASE_API_KEY);
    if(!res.ok) return null;
    const doc = await res.json();
    return doc.fields || null;
  }catch(e){
    return null;
  }
}

// Alternative wordings of the same rebuttal, generated when the alert went
// out. Absent (or unreachable) simply means everyone shares the original.
function stringArray(fields, name){
  const node = fields && fields[name] && fields[name].arrayValue;
  const values = node && node.values ? node.values : [];
  return values.map(v => v.stringValue).filter(Boolean);
}

async function loadVariants(){
  if(!messageId) return { male: [], female: [], perPerson: 1 };
  try{
    const res = await fetch(VARIANTS_DOC_URL + encodeURIComponent(messageId) + '?key=' + FIREBASE_API_KEY);
    if(!res.ok) return { male: [], female: [], perPerson: 1 };
    const doc = await res.json();
    const fields = doc.fields || {};
    const perPerson = fields.perPerson && fields.perPerson.integerValue
      ? parseInt(fields.perPerson.integerValue, 10) : 1;
    const male = stringArray(fields, 'male');
    const female = stringArray(fields, 'female');
    if(male.length || female.length){
      return {
        male: male.length ? male : female,
        female: female.length ? female : male,
        perPerson: perPerson || 1,
        // Our own copy of the offending post's URL, in case the alert
        // document doesn't carry one.
        postUrl: fields.postUrl && fields.postUrl.stringValue,
        // One sentence describing the post, with its subject named.
        postSummary: fields.postSummary && fields.postSummary.stringValue,
        // The debunk source on our own short domain; counts clicks and spares
        // the composer the percent-encoded Hebrew of the raw link.
        sourceShort: fields.sourceShort && fields.sourceShort.stringValue
      };
    }
    // Alerts generated before gendered variants existed.
    const legacy = stringArray(fields, 'variants');
    return { male: legacy, female: legacy, perPerson: 1 };
  }catch(e){
    return { male: [], female: [], perPerson: 1 };
  }
}

// This reader's own block of wordings. Everyone drawn for the alert gets a
// different block, so browsing alternatives can't reach someone else's text.
function myBlock(list, slot, perPerson){
  if(!list.length) return [];
  if(perPerson <= 1) return [list[slot % list.length]];
  const start = (slot * perPerson) % list.length;
  return list.slice(start, start + perPerson);
}

// Hebrew is gendered, so a first-person rebuttal reads wrong in the other
// gender. The main PWA already stores this choice in a cookie on the same
// origin — reuse it rather than asking again.
function readGender(){
  const match = document.cookie.match(/(?:^|;\s*)style=([^;]+)/);
  if(match){
    try{
      const style = JSON.parse(decodeURIComponent(match[1]));
      if(style && (style.gender === 'male' || style.gender === 'female')) return style.gender;
    }catch(e){}
  }
  return null;
}

function saveGender(gender){
  let style = {};
  const match = document.cookie.match(/(?:^|;\s*)style=([^;]+)/);
  if(match){
    try{ style = JSON.parse(decodeURIComponent(match[1])) || {}; }catch(e){}
  }
  style.gender = gender;
  document.cookie = 'style=' + encodeURIComponent(JSON.stringify(style)) + ';max-age=63072000;path=/';
}

function renderContext(){
  // The summary describes the post itself and names its subject. The claim is
  // the fallback: it is written as an abstract proposition and often arrives
  // with no subject at all, which is what this replaced.
  const text = PAGE.postSummary || PAGE.claim;
  els.context.textContent = '';
  const span = document.createElement('span');
  if(text){
    // Built from the offending post's own text, so it is attacker-authored.
    // textContent, never innerHTML.
    span.textContent = text;
  }else{
    span.className = 'placeholder';
    span.textContent = 'לא התקבלו פרטי הפוסט.';
  }
  els.context.appendChild(span);
}

// X rejects replies over 280 characters, so show the count when it matters.
const NETWORK_CHAR_LIMITS = { x: 280 };
// X replaces every URL with a t.co link of exactly this length when counting,
// however long the real address is.
const X_URL_COST = 23;

// The reply that gets published carries the debunk source, so a reader can
// check it. This — not the wording alone — is what gets copied and counted.
function replyText(){
  if(!PAGE.debunk) return '';
  // The short form of the source, when the alert carries one: it reads
  // cleanly in a composer where the raw link shows as percent-encoded Hebrew,
  // and clicks on it are counted. Old alerts fall back to the raw link.
  const source = PAGE.sourceShort || PAGE.sourceUrl;
  return source ? PAGE.debunk + '\n' + source : PAGE.debunk;
}

// Counting the raw string would overstate a long source URL and wrongly show
// the reply as too long.
function billedLength(text){
  return text.replace(/https?:\/\/\S+/g, 'x'.repeat(X_URL_COST)).length;
}

function renderLength(){
  const limit = NETWORK_CHAR_LIMITS[PAGE.network];
  if(!limit || !PAGE.debunk){ els.length.hidden = true; return; }
  const used = billedLength(replyText());
  els.length.textContent = `${used} / ${limit} תווים`;
  els.length.classList.toggle('over', used > limit);
  els.length.hidden = false;
}

function renderDebunk(){
  if(PAGE.debunk){
    els.quoteText.classList.remove('placeholder');
    els.quoteText.textContent = replyText();
    els.acceptBtn.disabled = false;
    renderLength();
    refreshScrollHint();
  } else {
    els.quoteText.classList.add('placeholder');
    els.quoteText.textContent = 'לא נמצאה הפרכה עבור הפוסט הזה.';
    els.acceptBtn.disabled = true;
  }
}

// The reply scrolls inside its card. Say so when there is more to read, and
// stop saying it once the reader reaches the end.
function refreshScrollHint(){
  const el = els.quoteText, wrap = els.cardWrap;
  if(!el || !wrap) return;
  const more = el.scrollHeight > el.clientHeight + 8;
  wrap.classList.toggle('can-scroll', more);
  const atEnd = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
  wrap.classList.toggle('scrolled-to-end', atEnd);
}

function watchQuoteScroll(){
  if(els.quoteText) els.quoteText.addEventListener('scroll', refreshScrollHint, { passive: true });
  window.addEventListener('resize', refreshScrollHint);
}

function renderSource(){
  const sep = document.getElementById('hintSep');
  if(!PAGE.sourceUrl && !PAGE.sourceShort){
    els.source.hidden = true;
    if(sep) sep.hidden = true;
    return;
  }
  els.source.textContent = '';
  const a = document.createElement('a');
  a.href = PAGE.sourceShort || PAGE.sourceUrl;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = 'מקור ההפרכה';
  els.source.appendChild(a);
  els.source.hidden = false;
  if(sep) sep.hidden = false;
}

/* ---------- actions ---------- */

// Where "open" should actually take the reader.
//
// X posts: it depends on the platform, and every branch here was set by
// testing on real devices — do not "simplify" this without re-testing.
//
// DESKTOP + iOS: the /intent/tweet web intent. The X iOS app claims it as a
// universal link and opens its reply composer on the right post, thread
// context visible above, reply prefilled (verified on an iPhone 13 Pro Max,
// 2026-08-29). /intent/post is NOT claimed (login wall) and twitter://
// schemes trigger an "Open in X?" dialog every time.
//
// ANDROID: the plain post URL. Two volunteers (Samsung + Pixel, X app
// installed) got the intent as a bare draft composer — no thread context, no
// scrolling up to the post, and no visible "Replying to", so posting risked
// a standalone tweet instead of a reply. The plain URL opens the app on the
// post itself; the reader taps reply and pastes from the clipboard.
function openPost(){
  const m = String(PAGE.postUrl || '').match(/(?:twitter\.com|x\.com)\/[A-Za-z0-9_]+\/status\/(\d+)/i);
  const isAndroid = /android/i.test(navigator.userAgent);
  if(m && !isAndroid){
    window.location.href = 'https://x.com/intent/tweet?in_reply_to=' + m[1]
      + '&text=' + encodeURIComponent(replyText());
    return;
  }
  window.location.href = PAGE.postUrl;
}

els.acceptBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(replyText());
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = replyText();
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  els.acceptBtn.classList.add('done');
  els.acceptLabel.textContent = 'הועתק ✓';
  track('copy_open');

  if(PAGE.postUrl){
    const url = PAGE.postUrl;
    setTimeout(openPost, 350);
    setTimeout(() => {
      if(document.visibilityState === 'visible'){
        els.hint.innerHTML = `<a href="${url}">פתח/י את הפוסט</a> והדבק/י את ההפרכה`;
      }
    }, 1900);
  } else {
    els.hint.textContent = 'ההפרכה הועתקה — הדביקו אותה כתגובה לפוסט.';
  }
});

function applyGender(next){
  gender = next;
  variants = variantSets[next] && variantSets[next].length ? variantSets[next] : variantSets.male;
  els.genderMale.classList.toggle('selected', next === 'male');
  els.genderFemale.classList.toggle('selected', next === 'female');
  if(variants.length){
    variantAt = Math.min(variantAt, variants.length - 1);
    PAGE.debunk = variants[variantAt];
  }
}

[els.genderMale, els.genderFemale].forEach(btn => {
  btn.addEventListener('click', () => {
    applyGender(btn.dataset.gender);
    saveGender(btn.dataset.gender);
    renderDebunk();
    els.acceptBtn.classList.remove('done');
    els.acceptLabel.textContent = 'העתק ופתח';
  });
});

function renderVariantCounter(){
  els.wordingCounter.textContent = variants.length > 1
    ? `${variantAt + 1} מתוך ${variants.length}` : '';
}

function showWording(step){
  if(variants.length < 2) return;
  variantAt = (variantAt + step + variants.length) % variants.length;
  PAGE.debunk = variants[variantAt];
  renderDebunk();
  renderVariantCounter();
  els.acceptBtn.classList.remove('done');
  els.acceptLabel.textContent = 'העתק ופתח';
}

els.nextWording.addEventListener('click', () => showWording(1));
els.prevWording.addEventListener('click', () => showWording(-1));

// Swipe across the card to move between wordings.
//
// The gesture must be predominantly HORIZONTAL. Without that test, an ordinary
// vertical scroll inside the card counted as a swipe the moment the thumb drifted
// 40px sideways — which a thumb arc does easily on a large phone — so the text
// jumped to another wording instead of scrolling. Users reported it as "scrolling
// doesn't work", and it reproduced on big Android screens while smaller phones,
// iPhones and desktop mice were fine.
const SWIPE_THRESHOLD = 40;
// Horizontal travel must beat vertical by this much to count as a sideways swipe.
const SWIPE_DOMINANCE = 1.5;

let touchStart = null;
els.card.addEventListener('touchstart', (e) => {
  // A second finger means a pinch or a zoom, never a page swipe.
  touchStart = e.touches.length === 1
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
    : null;
}, { passive: true });
els.card.addEventListener('touchend', (e) => {
  const start = touchStart;
  touchStart = null;
  if(!start) return;
  const dx = e.changedTouches[0].clientX - start.x;
  const dy = e.changedTouches[0].clientY - start.y;
  if(Math.abs(dx) < SWIPE_THRESHOLD) return;
  if(Math.abs(dx) < Math.abs(dy) * SWIPE_DOMINANCE) return;   // a scroll, not a swipe
  showWording(dx <= 0 ? -1 : 1);
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') showWording(1);
  else if(e.key === 'ArrowLeft') showWording(-1);
});

/* ---------- problem report ---------- */

const FEEDBACK_URL = EVENTS_URL.replace(/\/e$/, '/feedback');
const report = { reasons: new Set(), sending: false };

function refreshReportSend(){
  const has = report.reasons.size > 0 || els.reportNote.value.trim().length > 0;
  els.reportSend.disabled = !has || report.sending;
}

document.querySelectorAll('.report-option').forEach(btn => {
  btn.addEventListener('click', () => {
    const reason = btn.dataset.reason;
    if(report.reasons.has(reason)){
      report.reasons.delete(reason);
      btn.classList.remove('selected');
      btn.querySelector('.tick').textContent = '';
    } else {
      report.reasons.add(reason);
      btn.classList.add('selected');
      btn.querySelector('.tick').textContent = '✓';
    }
    refreshReportSend();
  });
});

els.reportNote.addEventListener('input', refreshReportSend);

els.reportBtn.addEventListener('click', () => {
  els.reportOverlay.hidden = false;
});

function closeReport(){
  els.reportOverlay.hidden = true;
}

els.reportCancel.addEventListener('click', closeReport);
els.reportOverlay.addEventListener('click', (e) => {
  if(e.target === els.reportOverlay) closeReport();
});

els.reportSend.addEventListener('click', async () => {
  report.sending = true;
  els.reportSend.disabled = true;
  els.reportSend.textContent = 'שולח…';

  const slot = Number.isInteger(variantIndex) && variantIndex >= 0 ? variantIndex : 0;
  const payload = {
    message_id: messageId,
    recipient: String(slot),
    reasons: [...report.reasons],
    note: els.reportNote.value.trim().slice(0, 1000),
    // What the volunteer was actually looking at, which may be any of the
    // wordings — the team can't tell which from the alert alone.
    wording: (PAGE.debunk || '').slice(0, 1000),
    gender: readGender() || '',
    session: visitorToken
  };

  try{
    await fetch(FEEDBACK_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
      keepalive: true
    });
  }catch(e){ /* reported below either way — a lost report must not look like an error */ }

  els.reportSend.textContent = 'נשלח ✓';
  setTimeout(() => {
    closeReport();
    document.getElementById('reportLabel').textContent = 'הדיווח נשלח — תודה';
    els.reportBtn.disabled = true;
  }, 700);
});

els.declineBtn.addEventListener('click', () => {
  track('decline');
  els.quoteText.classList.add('placeholder');
  els.quoteText.textContent = 'בסדר גמור. אפשר לסגור את החלון.';
  els.acceptBtn.disabled = true;
  els.declineBtn.disabled = true;
  els.declineBtn.textContent = 'תודה בכל זאת ✓';
});

/* ---------- init ---------- */

async function init(){
  const fields = await loadMessage();
  if(!fields){
    els.context.innerHTML = '<span class="placeholder">לא נמצאו פרטי ההפרכה.</span>';
    els.quoteText.classList.add('placeholder');
    els.quoteText.textContent = 'הקישור אינו תקין או שפג תוקפו.';
    return;
  }

  const { claim, debunk } = splitClaimAndDebunk(field(fields, 'text'));
  PAGE.claim = claim;
  PAGE.debunk = debunk;

  const loaded = await loadVariants();
  if(!PAGE.postUrl && loaded.postUrl) PAGE.postUrl = loaded.postUrl;
  PAGE.postSummary = loaded.postSummary || '';
  PAGE.sourceShort = loaded.sourceShort || null;
  PAGE.network = networkFromUrl(PAGE.postUrl || '');

  const slot = Number.isInteger(variantIndex) && variantIndex >= 0 ? variantIndex : 0;
  variantSets = {
    male: myBlock(loaded.male, slot, loaded.perPerson),
    female: myBlock(loaded.female, slot, loaded.perPerson)
  };

  const storedGender = readGender();      // null until the reader tells us
  applyGender(storedGender || 'male');

  if(variants.length){
    variantAt = 0;
    PAGE.debunk = variants[variantAt];
    els.rephrase.hidden = variants.length < 2;
    // Ask only when we don't already know, and only when it changes the text.
    const differs = variantSets.male.some((v, i) => v !== variantSets.female[i]);
    els.genderRow.hidden = Boolean(storedGender) || !differs;
  }
  renderVariantCounter();
  PAGE.postUrl = field(fields, 'post_url');
  PAGE.sourceUrl = field(fields, 'message_link');

  renderContext();
  renderDebunk();
  renderSource();
  renderNetworkIcons();
  watchQuoteScroll();
  refreshScrollHint();
  track('open');
}

init();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('../service-worker.js').catch(() => {});
}
</script>
