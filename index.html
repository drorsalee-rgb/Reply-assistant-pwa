<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17261f" />
<title>Yoriki Social</title>
<meta property="og:title" content="Yoriki Social" />
<meta property="og:description" content="קבלו הצעת תגובה מותאמת אישית, ולחיצה אחת להעתקה." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://drorsalee-rgb.github.io/Reply-assistant-pwa/" />
<meta property="og:image" content="https://drorsalee-rgb.github.io/Reply-assistant-pwa/icons/icon-512.png" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png?v=2" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1e25;
    --bg-soft:#123642;
    --paper:#eaf6f8;
    --paper-edge:#ece6d8;
    --ink:#1c2620;
    --ink-soft:#5b6660;
    --gold:#28c2e0;
    --gold-deep:#1c9db8;
    --good:#5f9c7d;
    --warn:#d97a4b;
    --warn-bg:#3a2a1c;
    --panel:#0c2027;
    --panel-border:#1f4750;
    --field-bg:#0e2730;
    --card-bg:#123642;
    --card-header-bg:#0c2730;
    --card-border:#1f5b66;
    --accent:#28c2e0;
    --accent-deep:#1c9db8;
    --accent-ink:#06222b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-soft), transparent),
      var(--bg);
    height:100vh;
    height:100dvh;
    overflow:hidden;
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .screen{
    width:100%;
    max-width:420px;
    height:100%;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    padding:max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  .style-bar{
    display:flex;
    flex:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.07);
  }
  .style-bar .label{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    letter-spacing:0.02em;
    color:#8aa097;
    display:block;
    margin-bottom:2px;
  }
  .style-bar .value{
    font-size:18px;
    font-weight:600;
    color:var(--paper);
  }
  .style-bar .value.empty{
    color:#7c8c82;
    font-weight:500;
    font-style:italic;
  }
  .edit-btn{
    flex:none;
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  /* Before a style is chosen the whole bar is the tap target */
  .style-bar.clickable{
    cursor:pointer;
    border-color:rgba(40,194,224,0.45);
    background:rgba(40,194,224,0.08);
  }
  .style-bar.clickable:active{ transform:scale(0.99); background:rgba(40,194,224,0.14); }
  .edit-btn:active{ transform:scale(0.92); background:rgba(255,255,255,0.16); }
  .edit-btn svg{ width:16px;height:16px; color:var(--gold); }

  .banner{
    display:none;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:12px;
    background:var(--warn-bg);
    color:#f0c9a8;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .banner.show{ display:flex; }
  .banner .dot{
    flex:none; width:7px;height:7px;border-radius:50%;background:var(--warn);
  }

  .context-wrap{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:none;
    min-height:0;
  }

  .resize-handle{
    flex:none;
    height:20px;
    margin:-7px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:row-resize;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
  }
  .resize-handle .grip{
    width:40px;height:5px;border-radius:3px;
    background:rgba(255,255,255,0.18);
    transition:background .15s ease;
  }
  .resize-handle:active .grip,
  .resize-handle.dragging .grip{ background:var(--accent); }
  .section-label{
    flex:none;
    margin:0;
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    letter-spacing:0.02em;
    color:#8aa097;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .summary-icon svg{ width:17px; height:17px; }
  .section-label .author{
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    font-size:15px;
    color:#a9c0b6;
    font-weight:600;
    direction:ltr;
    unicode-bidi:isolate;
  }
  .context{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    font-size:24px;
    color:#cdd9d1;
    padding:16px 16px;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    background:rgba(255,255,255,0.04);
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .context .snippet{
    white-space:pre-line;
    opacity:0.9;
    line-height:1.7;
  }

  .card-wrap{ position:relative; display:flex; flex-direction:column; flex:1 1 auto; min-height:220px; }
  .card{
    position:relative;
    background:var(--card-bg);
    color:var(--paper);
    border-radius:18px;
    border:1.5px solid var(--card-border);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    box-shadow:0 18px 40px -12px rgba(0,0,0,0.55);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s ease, filter .25s ease;
  }
  .card.locked{ filter:grayscale(0.4) brightness(0.85); }

  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    background:var(--card-header-bg);
    border-bottom:1px solid var(--card-border);
  }
  .card-title{
    flex:1;
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:var(--paper);
  }
  .nav-arrow{
    flex:none;
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(40,194,224,0.12);
    border:1.5px solid var(--accent);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .nav-arrow svg{ width:16px;height:16px; }
  .nav-arrow:active{ transform:scale(0.9); background:rgba(40,194,224,0.25); }
  .nav-arrow:disabled{ opacity:0.3; pointer-events:none; }

  .quote-text{
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    font-size:27px;
    line-height:1.6;
    font-weight:600;
    margin:0;
    flex:1;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    padding:24px 22px;
    color:#eaf6f8;
  }
  /* Center short text vertically without clipping long text: auto-margin
     spacers collapse to zero when the content overflows, so scrolling
     always starts at the first line. */
  .quote-text::before, .quote-text::after{ content:''; margin:auto; }
  .quote-text.placeholder{
    color:#7ea3aa;
    font-style:italic;
    font-size:17px;
    font-weight:500;
  }

  .card.swap-out{ transform:translateX(14px) scale(.985); opacity:0; }
  .card.swap-in{ transform:translateX(-14px) scale(.985); opacity:0; }

  .actions{ display:flex; flex-direction:column; gap:10px; flex:none; }
  button{
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    border:none;
    cursor:pointer;
    -webkit-appearance:none;
  }
  .btn-accept{
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    font-size:17px;
    padding:17px 20px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s ease, background .15s ease, opacity .2s ease;
  }
  .btn-accept:active{ transform:scale(0.97); }
  .social-icon{ display:inline-flex; }
  .social-icon svg{ width:20px; height:20px; fill:currentColor; }
  .btn-decline{
    background:transparent;
    border:1px solid #3a4d52;
    color:#8aa097;
    font-weight:600;
    font-size:15px;
    padding:11px 20px;
    border-radius:14px;
    transition:transform .15s ease, opacity .2s ease;
  }
  .btn-decline:active{ transform:scale(0.97); }
  /* Personal, device-local tally of published replies */
  .tally{
    margin:0;
    text-align:center;
    font-size:13.5px;
    color:#8aa097;
  }
  .tally b{ color:var(--gold); font-size:15.5px; font-weight:800; }
  .tally.pop{ animation:tallyPop .65s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes tallyPop{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.18); color:var(--gold); }
    100%{ transform:scale(1); }
  }
  .hint a{ color:var(--gold); text-decoration:underline; font-weight:700; }
  /* Short screens: tighten spacing so the full layout fits */
  @media (max-height: 700px){
    .screen{ padding:12px 16px; gap:10px; }
    .card-wrap{ min-height:190px; }
    .btn-accept{ padding:13px 20px; }
    .btn-decline{ padding:9px 20px; }
  }
  .btn-accept.done{ background:var(--good); color:#0e1f15; }
  .btn-accept:disabled{ background:#3a4d52; color:#7c9499; pointer-events:none; }

  .hint{
    text-align:center;
    font-size:13px;
    color:#7ea3aa;
    margin:0;
  }

  .skeleton{
    background:linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.18) 37%, rgba(255,255,255,0.08) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
    border-radius:6px;
    height:14px;
  }
  @keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ---------- full-screen edit-style panel ---------- */
  .panel{
    position:fixed; inset:0;
    background:var(--panel);
    color:var(--paper);
    z-index:10;
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;
    direction:rtl;
  }
  .panel.open{ transform:translateY(0); }
  .panel-inner{
    max-width:420px;
    margin:0 auto;
    padding:18px 22px 32px;
  }
  .panel-header{
    display:flex;
    align-items:center;
    position:relative;
    padding:8px 0 22px;
  }
  .back-btn{
    position:absolute; right:0;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    color:var(--paper);
  }
  .back-btn svg{ width:22px;height:22px; }
  .panel-header h1{
    flex:1;
    text-align:center;
    font-size:19px;
    font-weight:700;
    margin:0;
  }
  .panel-desc{
    font-size:14px;
    line-height:1.7;
    color:#aebdb5;
    margin:0 0 28px;
  }
  .field{ margin-bottom:22px; }
  .field-label{
    font-size:14px;
    font-weight:600;
    color:var(--paper);
    margin:0 0 10px;
  }
  .dropdown{ position:relative; }
  .dropdown-trigger{
    width:100%;
    background:var(--field-bg);
    border:1.5px solid var(--panel-border);
    border-radius:12px;
    padding:15px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--paper);
    font-size:15px;
    font-weight:600;
    transition:border-color .15s ease;
  }
  .dropdown.open .dropdown-trigger{
    border-color:var(--gold);
  }
  .dropdown-trigger .chev{
    width:16px;height:16px;
    color:#9fb0a6;
    transition:transform .2s ease;
    flex:none;
  }
  .dropdown.open .dropdown-trigger .chev{ transform:rotate(180deg); }
  .dropdown-trigger .current.placeholder{ color:#6c7d73; font-weight:500; }

  .dropdown-list{
    margin-top:8px;
    border:1.5px solid var(--gold);
    border-radius:12px;
    overflow:hidden;
    background:#1c2820;
    max-height:0;
    opacity:0;
    transition:max-height .25s ease, opacity .2s ease;
  }
  .dropdown.open .dropdown-list{
    max-height:260px;
    opacity:1;
  }
  .dropdown-option{
    width:100%;
    text-align:right;
    padding:14px 16px;
    font-size:15px;
    font-weight:600;
    color:#dde7e1;
    background:transparent;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .dropdown-option:last-child{ border-bottom:none; }
  .dropdown-option.selected{ color:var(--gold); }
  .dropdown-option:active{ background:rgba(255,255,255,0.05); }

  .panel-save{
    width:100%;
    background:var(--gold);
    color:#231708;
    font-weight:700;
    font-size:16px;
    padding:16px;
    border-radius:14px;
    margin-top:8px;
    transition:transform .15s ease, opacity .2s ease;
  }
  .panel-save:active{ transform:scale(0.98); }
  .panel-save:disabled{ opacity:0.45; pointer-events:none; }
</style>
</head>
<body>

<div class="screen">

  <div class="style-bar" id="styleBar">
    <div>
      <span class="label">הסגנון שלי</span>
      <span class="value empty" id="styleValue">לא נבחר</span>
    </div>
    <button class="edit-btn" id="editStyleBtn" aria-label="עריכת סגנון">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
      </svg>
    </button>
  </div>

  <div class="banner" id="banner">
    <span class="dot"></span>
    <span>בחר/י סגנון כדי לקבל הצעות</span>
  </div>

  <div class="context-wrap" id="contextWrap">
    <p class="section-label"><span>תקציר הפוסט</span><span class="social-icon summary-icon" id="summaryIcon" hidden></span><span class="author" id="postAuthor" hidden></span></p>
    <div class="context" id="context">
      <span class="snippet">טוען פרטי הפוסט…</span>
    </div>
  </div>

  <div class="resize-handle" id="resizeHandle" role="separator" aria-label="שינוי גודל תקציר הפוסט" aria-orientation="horizontal">
    <span class="grip"></span>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-header">
        <button class="nav-arrow" id="prevBtn" aria-label="הצעה קודמת" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <span class="card-title" id="forUser">מכין/ה הצעה…</span>
        <button class="nav-arrow" id="nextBtn" aria-label="הצעה הבאה" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>
      <p class="quote-text" id="quoteText">
        <span class="skeleton" style="width:100%;display:block;margin-bottom:8px;"></span>
        <span class="skeleton" style="width:80%;display:block;"></span>
      </p>
    </div>
  </div>

  <div class="actions">
    <button class="btn-accept" id="acceptBtn" disabled>
      <span class="social-icon" id="socialIcon" hidden></span>
      <span id="acceptLabel">העתק ופתח</span>
    </button>
    <p class="hint" id="hint">הדבק תגובה אחרי פתיחה</p>
    <p class="tally" id="tally" hidden></p>
    <button class="btn-decline" id="declineBtn">לא, תודה</button>
  </div>
</div>

<!-- full-screen style panel -->
<div class="panel" id="panel">
  <div class="panel-inner">
    <div class="panel-header">
      <button class="back-btn" id="backBtn" aria-label="חזרה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 id="panelTitle">סגנון תגובה</h1>
    </div>
    <p class="panel-desc">הצעות התגובה נוצרות באופן אוטומטי בעזרת הפרמטרים האישיים וההעדפות שלך:</p>

    <div class="field">
      <p class="field-label">מגדר</p>
      <div class="dropdown" id="genderDropdown">
        <button class="dropdown-trigger" type="button">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          <span class="current placeholder" id="genderCurrent">בחר/י</span>
        </button>
        <div class="dropdown-list" id="genderList">
          <button class="dropdown-option" data-value="male">זכר</button>
          <button class="dropdown-option" data-value="female">נקבה</button>
        </div>
      </div>
    </div>

    <div class="field">
      <p class="field-label">סגנון תגובה</p>
      <div class="dropdown" id="toneDropdown">
        <button class="dropdown-trigger" type="button">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          <span class="current placeholder" id="toneCurrent">בחר/י</span>
        </button>
        <div class="dropdown-list" id="toneList">
          <button class="dropdown-option" data-value="cynical">ציני</button>
          <button class="dropdown-option" data-value="emotional">רגשי</button>
          <button class="dropdown-option" data-value="formal">ממלכתי</button>
          <button class="dropdown-option" data-value="aggressive">אגרסיבי</button>
        </div>
      </div>
    </div>

    <button class="panel-save" id="panelSaveBtn">שמירה</button>
  </div>
</div>

<script>
const API_BASE = 'https://claim-social-reactions-ru4qjbbrxa-ew.a.run.app';

// Some apps (e.g. WhatsApp/iOS link handling) re-encode an already-encoded
// URL when the link is tapped or copied, leaving values like "%D7%9B..."
// still percent-encoded after URLSearchParams' single automatic decode.
// Decode repeatedly until it stops changing (bounded, so plain text with an
// incidental "%" pattern can't loop forever).
function safeDecode(value){
  if(!value) return value;
  let result = value;
  for(let i = 0; i < 3 && /%[0-9A-Fa-f]{2}/.test(result); i++){
    let decoded;
    try{ decoded = decodeURIComponent(result); }catch(e){ break; }
    if(decoded === result) break;
    result = decoded;
  }
  return result;
}

const params = new URLSearchParams(window.location.search);
const documentId = safeDecode(params.get('document_id') || params.get('doc') || params.get('documentId') || null);

const PAGE_CONTEXT = {
  snippet: safeDecode(params.get('post_snippet') || params.get('snippet') || params.get('post_text')) || 'לא התקבל תקציר פוסט.',
  // The real, canonical URL of the post. Triggers the OS-level handoff to
  // the native app (Universal Links / App Links) when one is installed.
  postUrl: safeDecode(params.get('post_url') || params.get('postUrl')) || null,
  socialMedia: safeDecode(params.get('social_media') || params.get('socialMedia')) || null
};


// ---- usage counters ----
// Aggregate only: no cookies, no ids, no personal data — a random per-tab
// string just prevents one visit being counted as several opens. Fire and
// forget; failures must never affect the app.
const EVENTS_URL = 'https://pwa-events-658282975646.europe-west1.run.app/e';

// Anonymous, random, device-local id — not tied to any person or phone
// number. It exists so the counters can say "how many people" instead of
// "how many taps"; the same device opening a post twice counts once.
const sessionToken = (() => {
  const fresh = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  try{
    let t = localStorage.getItem('vid');
    if(!t){ t = fresh(); localStorage.setItem('vid', t); }
    return t;
  }catch(e){
    try{
      let t = sessionStorage.getItem('vid');
      if(!t){ t = fresh(); sessionStorage.setItem('vid', t); }
      return t;
    }catch(e2){ return ''; }
  }
})();

function track(event){
  if(!documentId) return;
  try{
    const payload = JSON.stringify({ event, document_id: documentId, session: sessionToken });
    if(navigator.sendBeacon){
      navigator.sendBeacon(EVENTS_URL, new Blob([payload], { type: 'text/plain' }));
    } else {
      fetch(EVENTS_URL, { method: 'POST', body: payload, keepalive: true }).catch(() => {});
    }
  }catch(e){}
}

// ---- personal tally ----
// A step-counter style reward: how many replies this device has published.
// Lives only in localStorage — never sent anywhere, never leaves the phone.
const TALLY_KEY = 'copyTally';
// How long the tally bump stays on screen before handing off to the post.
const TALLY_PAUSE_MS = 650;

function readTally(){
  try{
    const raw = localStorage.getItem(TALLY_KEY);
    if(!raw) return { total: 0, ts: [] };
    const parsed = JSON.parse(raw);
    return { total: parsed.total || 0, ts: Array.isArray(parsed.ts) ? parsed.ts : [] };
  }catch(e){ return { total: 0, ts: [] }; }
}

function bumpTally(){
  const tally = readTally();
  tally.total += 1;
  tally.ts.push(Date.now());
  tally.ts = tally.ts.slice(-60); // only recent timestamps are needed
  try{ localStorage.setItem(TALLY_KEY, JSON.stringify(tally)); }catch(e){}
  return tally;
}

function renderTally(){
  const { total, ts } = readTally();
  if(!total){ els.tally.hidden = true; return; }
  const week = ts.filter(t => t >= Date.now() - 7 * 24 * 3600 * 1000).length;
  const milestone = total % 10 === 0;
  const noun = total === 1 ? 'תגובה אחת' : `<b>${total}</b> תגובות`;
  let text = `${milestone ? '🎉' : '🔥'} פרסמת ${noun} מהמכשיר הזה`;
  if(week > 0 && week < total) text += ` · <b>${week}</b> השבוע`;
  els.tally.innerHTML = text;
  const wasHidden = els.tally.hidden;
  els.tally.hidden = false;
  if(wasHidden) fitContextHeight(); // the extra line must not push buttons off-screen
}

function getStyle(){
  const match = document.cookie.match(/(?:^|;\s*)style=([^;]+)/);
  if(!match) return null;
  try{ return JSON.parse(decodeURIComponent(match[1])); }catch(e){ return null; }
}

function setStyle(style){
  const maxAge = 60 * 60 * 24 * 365 * 2;
  document.cookie = `style=${encodeURIComponent(JSON.stringify(style))}; max-age=${maxAge}; path=/; SameSite=Lax`;
}

// On short screens (e.g. iPhone SE/8-size viewports), shrink the description

function fitContextHeight(){
  const screenEl = document.querySelector('.screen');
  if(!screenEl) return;
  const overflow = screenEl.scrollHeight - screenEl.clientHeight;
  if(overflow > 0){
    const cur = els.contextWrap.getBoundingClientRect().height;
    applyContextHeight(cur - overflow);
  }
}

const CONTEXT_MIN_H = 70;
const CONTEXT_MAX_H = 320;
const CONTEXT_DEFAULT_H = 260;

function applyContextHeight(h){
  const clamped = Math.max(CONTEXT_MIN_H, Math.min(CONTEXT_MAX_H, h));
  els.contextWrap.style.height = clamped + 'px';
  return clamped;
}

(function initContextHeight(){
  const saved = parseInt(localStorage.getItem(CONTEXT_HEIGHT_KEY), 10);

function onResizeEnd(){

// ---- claim-social-reactions API ----

// Single claim attempt; retrying on an empty pool is handled by the
// exhausted-retry loop below (every 5s for up to a minute), which also
// covers reactions freed by other users tapping "לא, תודה".
async function claimReactions(){
  if(!documentId || !currentStyle) return false;
  const reaction_array_name = reactionArrayNameFor(currentStyle);
  let res;
  try{
    res = await fetch(API_BASE + '/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ document_id: documentId, reaction_array_name })
    });
  }catch(e){
    return false;
  }
  if(res.status !== 200) return false;
  const data = await res.json();
  queue.push(...(data.claimedReactions || []));
  return true;
}

function returnUnused(excludeId, reactionArrayNameOverride){
  if(!documentId) return;
  const reaction_array_name = reactionArrayNameOverride || (currentStyle && reactionArrayNameFor(currentStyle));
  if(!reaction_array_name) return;
  const ids = queue.map(it => it.id).filter(id => id !== excludeId);
  if(!ids.length) return;
  try{
    fetch(API_BASE + '/return-unused', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({ document_id: documentId, reaction_array_name, reaction_ids: ids })
    }).catch(() => {});
  }catch(e){}
}

// When the pool is empty, keep retrying every 5 seconds for up to a minute —
// suggestions free up when other users decline or leave.
const EXHAUSTED_RETRY_MS = 5000;
const EXHAUSTED_RETRY_MAX = 12;
let exhaustedRetryTimer = null;
let exhaustedRetryCount = 0;

function stopExhaustedRetry(){
  if(exhaustedRetryTimer){ clearTimeout(exhaustedRetryTimer); exhaustedRetryTimer = null; }
}

function scheduleExhaustedRetry(){
  stopExhaustedRetry();
  exhaustedRetryTimer = setTimeout(async () => {
    exhaustedRetryTimer = null;
    if(!exhausted) return; // user navigated away from the empty state
    exhaustedRetryCount += 1;
    const ok = await claimReactions();
    if(!exhausted) return;
    if(ok && queueIndex + 1 < queue.length){
      exhausted = false;
      goNext(false);
    } else if(exhaustedRetryCount < EXHAUSTED_RETRY_MAX){
      scheduleExhaustedRetry();
    } else {
      els.quoteText.textContent = 'אין כרגע הצעות פנויות. נסו שוב מאוחר יותר.';
    }
  }, EXHAUSTED_RETRY_MS);
}

function showExhausted(){
  exhausted = true;
  els.quoteText.classList.add('placeholder');
  els.quoteText.textContent = 'אין כרגע הצעות פנויות. ממשיכים לנסות…';
  els.forUser.textContent = '—';
  els.acceptBtn.disabled = true;
  els.nextBtn.disabled = true;
  els.prevBtn.disabled = queueIndex <= 0;
  exhaustedRetryCount = 0;
  scheduleExhaustedRetry();
}

async function goNext(animate){
  if(!currentStyle || exhausted) return;
  const needsFetch = queueIndex + 1 >= queue.length;

  if(animate){
    els.card.classList.add('swap-out');
    await new Promise(r => setTimeout(r, 220));
  }

  els.acceptBtn.disabled = true;
  els.prevBtn.disabled = true;
  els.nextBtn.disabled = true;
  els.acceptBtn.classList.remove('done');
  els.acceptLabel.textContent = 'העתק ופתח';

  if(animate){
    els.quoteText.classList.remove('placeholder');
    els.quoteText.innerHTML = `<span class="skeleton" style="width:100%;display:block;margin-bottom:8px;"></span><span class="skeleton" style="width:80%;display:block;"></span>`;
    if(needsFetch) els.forUser.textContent = 'מכין/ה הצעה…';
    els.card.classList.remove('swap-out');
    els.card.classList.add('swap-in');
    requestAnimationFrame(() => els.card.classList.remove('swap-in'));
  }

  if(needsFetch){
    const ok = await claimReactions();
    if(!ok || queueIndex + 1 >= queue.length){
      showExhausted();
      return;
    }
  }

  queueIndex += 1;
  const item = queue[queueIndex];
  els.quoteText.classList.remove('placeholder');
  els.quoteText.textContent = item.response;
  els.forUser.textContent = `התגובה שלך: ${queueIndex + 1}`;
  currentText = item.response;

  els.acceptBtn.disabled = false;
  els.prevBtn.disabled = queueIndex <= 0;
  els.nextBtn.disabled = false;
}

async function goPrev(animate){
  if(!currentStyle || queueIndex <= 0) return;

  if(animate){
    els.card.classList.add('swap-out');
    await new Promise(r => setTimeout(r, 220));
  }

  queueIndex -= 1;
  const item = queue[queueIndex];

  els.acceptBtn.classList.remove('done');
  els.acceptLabel.textContent = 'העתק ופתח';
  els.quoteText.classList.remove('placeholder');
  els.quoteText.textContent = item.response;
  els.forUser.textContent = `התגובה שלך: ${queueIndex + 1}`;
  currentText = item.response;

  if(animate){
    els.card.classList.remove('swap-out');
    els.card.classList.add('swap-in');
    requestAnimationFrame(() => els.card.classList.remove('swap-in'));
  }

  stopExhaustedRetry();
  exhausted = false; // moving back makes "next" available again
  els.acceptBtn.disabled = false;
  els.prevBtn.disabled = queueIndex <= 0;
  els.nextBtn.disabled = false;
}

async function loadInitial(animate, staleReactionArrayName){
  if(queue.length) returnUnused(null, staleReactionArrayName);
  stopExhaustedRetry();
  queue = [];
  queueIndex = -1;
  exhausted = false;
  cleanedUp = false;
  await goNext(animate);
}

async function refreshUI(animateOnLoad, staleReactionArrayName){
  renderStyleBar();
  if(currentStyle){
    setLocked(false);
    await loadInitial(animateOnLoad, staleReactionArrayName);
  } else {
    setLocked(true);
  }
}

function closeAllDropdowns(except){

function wireDropdown(dropdown, listEl, currentEl, labels){
  dropdown.querySelector('.dropdown-trigger').addEventListener('click', () => {
    const willOpen = !dropdown.classList.contains('open');
    closeAllDropdowns(dropdown);
    dropdown.classList.toggle('open', willOpen);
  });
  listEl.querySelectorAll('.dropdown-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const value = opt.dataset.value;
      listEl.querySelectorAll('.dropdown-option').forEach(o => o.classList.toggle('selected', o === opt));
      currentEl.textContent = labels[value];
      currentEl.classList.remove('placeholder');
      dropdown.classList.remove('open');
      dropdown.dataset.value = value;
      updateSaveState();
    });
  });
}

async function navigate(direction){

  else await goPrev(true);

let touchStartX = null;
els.card.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
els.card.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  touchStartX = null;
  const SWIPE_THRESHOLD = 40;
  if(dx <= -SWIPE_THRESHOLD) navigate(-1);
  else if(dx >= SWIPE_THRESHOLD) navigate(1);

els.acceptBtn.addEventListener('click', async () => {
  const usedItem = queue[queueIndex];
  try{
    await navigator.clipboard.writeText(currentText);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = currentText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  els.acceptBtn.classList.add('done');
  els.acceptLabel.textContent = 'הועתק ✓';
  track('copy_open');
  bumpTally();
  renderTally();
  els.tally.classList.remove('pop');
  void els.tally.offsetWidth;   // restart the animation
  els.tally.classList.add('pop');

  // Release the other claimed-but-unused reactions back to the pool; the
  // accepted one stays claimed since it's the one actually being posted.
  returnUnused(usedItem ? usedItem.id : null);
  cleanedUp = true;

  // Hand off to the real post. If the platform's app is installed and
  // registered for Universal Links (iOS) / App Links (Android), the OS opens
  // it directly; otherwise the browser follows the link.
  //
  // The short pause lets the tally bump register before the screen changes.
  // It is deliberately brief: iOS ties the app handoff to the user's tap, so
  // a long delay risks landing in the browser instead of the app — and if
  // the navigation is blocked entirely, the fallback link below gives the
  // user a second, gesture-backed way to open the post.
  if(PAGE_CONTEXT.postUrl){
    const url = PAGE_CONTEXT.postUrl;
    setTimeout(() => { window.location.href = url; }, TALLY_PAUSE_MS);
    setTimeout(() => {
      if(document.visibilityState === 'visible'){
        els.hint.innerHTML = `<a href="${url}">פתח/י את הפוסט</a> והדבק/י את התגובה`;
      }
    }, TALLY_PAUSE_MS + 1600);
  }
});

// The user declines to reply altogether: release every claimed reaction
// (including the one on screen) back to the pool and show a farewell state.
els.declineBtn.addEventListener('click', () => {
  track('decline');
  stopExhaustedRetry();
  returnUnused(null);
  cleanedUp = true;
  queue = [];
  queueIndex = -1;
  els.forUser.textContent = '';
  els.quoteText.innerHTML = '<span class="snippet">בסדר גמור. אפשר לסגור את החלון.</span>';
  els.acceptBtn.disabled = true;
  els.prevBtn.disabled = true;
  els.nextBtn.disabled = true;
  els.declineBtn.disabled = true;
  els.declineBtn.textContent = 'התגובות שוחררו ✓';
});

// Best-effort: release any claimed-but-unused reactions if the user leaves
// without posting (closing the tab/app, or navigating away another way).
window.addEventListener('pagehide', () => {
  stopExhaustedRetry();
  if(cleanedUp) return;
  cleanedUp = true;
  returnUnused(null);
});

function detectSocialNetwork(name, url){
  const n = (name || '').toLowerCase();
  if(SOCIAL_ICONS[n]) return n;
  if(n === 'twitter') return 'x';
  const host = (() => { try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return ''; } })();
  if(/(^|\.)instagram\.com$/.test(host)) return 'instagram';
  if(/(^|\.)(x|twitter)\.com$/.test(host)) return 'x';
  if(/(^|\.)(facebook\.com|fb\.com)$/.test(host)) return 'facebook';
  if(/(^|\.)linkedin\.com$/.test(host)) return 'linkedin';
  if(/(^|\.)tiktok\.com$/.test(host)) return 'tiktok';
  if(/(^|\.)(youtube\.com|youtu\.be)$/.test(host)) return 'youtube';
  return null;
}

// Who published the post. The Firestore doc has no author field yet, so
// fall back to the handle embedded in the post URL where the network puts
// one there (X, TikTok, YouTube). Facebook share links and X's /i/status/
// form carry no handle — then we simply show nothing.
// Path segments that are part of the site's plumbing, never an account name.
const NON_AUTHOR_SEGMENTS = new Set([
  'share', 'groups', 'watch', 'reel', 'reels', 'p', 'tv', 'stories', 'story',
  'photo', 'photos', 'video', 'videos', 'media', 'pages', 'events', 'explore',
  'hashtag', 'marketplace', 'search', 'i', 'home', 'intent', 'notifications'
]);

function deriveAuthor(url){
  let parsed;
  try{ parsed = new URL(url); }catch(e){ return null; }
  const host = parsed.hostname.replace(/^www\./, '').toLowerCase();
  const segments = parsed.pathname.split('/').filter(Boolean);
  if(!segments.length) return null;

  let first;
  try{ first = decodeURIComponent(segments[0]); }catch(e){ first = segments[0]; }
  const second = (segments[1] || '').toLowerCase();
  const handle = name => '@' + name.replace(/^@/, '');

  if(first.startsWith('@')) return first;                       // tiktok, youtube, threads
  if(NON_AUTHOR_SEGMENTS.has(first.toLowerCase()) || first.includes('.php')) return null;

  if(/(^|\.)(x|twitter)\.com$/.test(host)){
    return (second === 'status' || second === 'statuses') ? handle(first) : null;
  }
  if(/(^|\.)(facebook\.com|fb\.com|fb\.watch)$/.test(host)){
    // facebook.com/{page}/videos|posts|photos/...
    return ['videos', 'posts', 'photos', 'video', 'reels'].includes(second) ? handle(first) : null;
  }
  if(/(^|\.)instagram\.com$/.test(host)){
    return ['p', 'reel', 'reels', 'tv'].includes(second) ? handle(first) : null;
  }
  return null;
}

function renderAuthor(){
  const author = PAGE_CONTEXT.author || deriveAuthor(PAGE_CONTEXT.postUrl || '');
  if(!author){ els.postAuthor.hidden = true; return; }
  els.postAuthor.textContent = author;
  els.postAuthor.hidden = false;
}

function renderSocialIcon(){
  const network = detectSocialNetwork(PAGE_CONTEXT.socialMedia, PAGE_CONTEXT.postUrl);
  const targets = [els.socialIcon, els.summaryIcon];
  if(!network){ targets.forEach(el => { el.hidden = true; }); return; }
  const svg = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="' + SOCIAL_ICONS[network] + '"/></svg>';
  targets.forEach(el => { el.innerHTML = svg; el.hidden = false; });
}

// Stored descriptions are sometimes English; the audience reads Hebrew.
// If less than a third of the letters are Hebrew, translate via Google's
// public endpoint (Hebrew quotes embedded in the English survive as-is).
function isMostlyEnglish(text){
  const hebrew = (text.match(/[֐-׿]/g) || []).length;
  const latin = (text.match(/[A-Za-z]/g) || []).length;
  return latin > 0 && hebrew / (hebrew + latin) < 0.34;
}

async function translateToHebrew(text){
  try{
    const res = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=he&dt=t&q=' + encodeURIComponent(text));
    if(!res.ok) return null;
    const data = await res.json();
    const out = (data[0] || []).map(seg => seg[0]).join('');
    return out || null;
  }catch(e){
    return null;
  }
}

async function init(){
  renderContext(PAGE_CONTEXT);

  const info = await fetchPostInfo();
  if(info){
    // Accept both the spec's snake_case names and the raw Firestore field names
    const snippet = info.post_snippet || info.postDescription;
    const postUrl = info.post_url || info.postUrl;
    if(snippet) PAGE_CONTEXT.snippet = snippet;
    if(postUrl) PAGE_CONTEXT.postUrl = postUrl;
    if(info.socialMedia) PAGE_CONTEXT.socialMedia = info.socialMedia;
    if(info.author) PAGE_CONTEXT.author = info.author;
    renderContext(PAGE_CONTEXT);
  }
  renderSocialIcon();
  renderAuthor();

  if(PAGE_CONTEXT.snippet && isMostlyEnglish(PAGE_CONTEXT.snippet)){
    const translated = await translateToHebrew(PAGE_CONTEXT.snippet);
    if(translated){
      PAGE_CONTEXT.snippet = translated;
      renderContext(PAGE_CONTEXT);
    }
  }

  track('open');
  renderTally();
  await refreshUI(false);
  fitContextHeight();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
