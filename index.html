<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17261f" />
<title>Yoriki Social</title>
<meta property="og:title" content="Yoriki Social" />
<meta property="og:description" content="קבלו הצעת תגובה מותאמת אישית, ולחיצה אחת להעתקה." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://drorsalee-rgb.github.io/Reply-assistant-pwa/" />
<meta property="og:image" content="https://drorsalee-rgb.github.io/Reply-assistant-pwa/icons/icon-512.png" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png?v=2" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1e25;
    --bg-soft:#123642;
    --paper:#eaf6f8;
    --paper-edge:#ece6d8;
    --ink:#1c2620;
    --ink-soft:#5b6660;
    --gold:#28c2e0;
    --gold-deep:#1c9db8;
    --good:#5f9c7d;
    --warn:#d97a4b;
    --warn-bg:#3a2a1c;
    --panel:#0c2027;
    --panel-border:#1f4750;
    --field-bg:#0e2730;
    --card-bg:#123642;
    --card-header-bg:#0c2730;
    --card-border:#1f5b66;
    --accent:#28c2e0;
    --accent-deep:#1c9db8;
    --accent-ink:#06222b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, var(--bg-soft), transparent),
      var(--bg);
    height:100vh;
    height:100dvh;
    overflow:hidden;
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .screen{
    width:100%;
    max-width:420px;
    height:100%;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:14px;
    padding:max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }

  .style-bar{
    display:flex;
    flex:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.07);
  }
  .style-bar .label{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    letter-spacing:0.02em;
    color:#8aa097;
    display:block;
    margin-bottom:2px;
  }
  .style-bar .value{
    font-size:18px;
    font-weight:600;
    color:var(--paper);
  }
  .style-bar .value.empty{
    color:#7c8c82;
    font-weight:500;
    font-style:italic;
  }
  .edit-btn{
    flex:none;
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .edit-btn:active{ transform:scale(0.92); background:rgba(255,255,255,0.16); }
  .edit-btn svg{ width:16px;height:16px; color:var(--gold); }

  .banner{
    display:none;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:12px;
    background:var(--warn-bg);
    color:#f0c9a8;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .banner.show{ display:flex; }
  .banner .dot{
    flex:none; width:7px;height:7px;border-radius:50%;background:var(--warn);
  }

  .context{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    font-size:24px;
    color:#cdd9d1;
    padding:16px 16px;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    background:rgba(255,255,255,0.04);
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .context .snippet{
    white-space:pre-line;
    opacity:0.9;
    line-height:1.7;
  }

  .card-wrap{ position:relative; display:flex; flex-direction:column; flex:1.4 1 auto; min-height:0; }
  .card{
    position:relative;
    background:var(--card-bg);
    color:var(--paper);
    border-radius:18px;
    border:1.5px solid var(--card-border);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    box-shadow:0 18px 40px -12px rgba(0,0,0,0.55);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s ease, filter .25s ease;
  }
  .card.locked{ filter:grayscale(0.4) brightness(0.85); }

  .card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    background:var(--card-header-bg);
    border-bottom:1px solid var(--card-border);
  }
  .card-title{
    flex:1;
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:var(--paper);
  }
  .nav-arrow{
    flex:none;
    width:34px;height:34px;
    border-radius:50%;
    background:rgba(40,194,224,0.12);
    border:1.5px solid var(--accent);
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .nav-arrow svg{ width:16px;height:16px; }
  .nav-arrow:active{ transform:scale(0.9); background:rgba(40,194,224,0.25); }
  .nav-arrow:disabled{ opacity:0.3; pointer-events:none; }

  .quote-text{
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    font-size:27px;
    line-height:1.6;
    font-weight:600;
    margin:0;
    flex:1;
    display:flex;
    align-items:center;
    overflow-y:auto;
    padding:24px 22px;
    color:#eaf6f8;
  }
  .quote-text.placeholder{
    color:#7ea3aa;
    font-style:italic;
    font-size:17px;
    font-weight:500;
  }

  .card.swap-out{ transform:translateX(14px) scale(.985); opacity:0; }
  .card.swap-in{ transform:translateX(-14px) scale(.985); opacity:0; }

  .actions{ display:flex; flex-direction:column; gap:10px; flex:none; }
  button{
    font-family:'Noto Sans Hebrew','Inter',sans-serif;
    border:none;
    cursor:pointer;
    -webkit-appearance:none;
  }
  .btn-accept{
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
    font-size:17px;
    padding:17px 20px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s ease, background .15s ease, opacity .2s ease;
  }
  .btn-accept:active{ transform:scale(0.97); }
  .btn-accept.done{ background:var(--good); color:#0e1f15; }
  .btn-accept:disabled{ background:#3a4d52; color:#7c9499; pointer-events:none; }

  .hint{
    text-align:center;
    font-size:13px;
    color:#7ea3aa;
    margin:0;
  }

  .skeleton{
    background:linear-gradient(90deg, rgba(255,255,255,0.08) 25%, rgba(255,255,255,0.18) 37%, rgba(255,255,255,0.08) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
    border-radius:6px;
    height:14px;
  }
  @keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* ---------- full-screen edit-style panel ---------- */
  .panel{
    position:fixed; inset:0;
    background:var(--panel);
    color:var(--paper);
    z-index:10;
    transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;
    direction:rtl;
  }
  .panel.open{ transform:translateY(0); }
  .panel-inner{
    max-width:420px;
    margin:0 auto;
    padding:18px 22px 32px;
  }
  .panel-header{
    display:flex;
    align-items:center;
    position:relative;
    padding:8px 0 22px;
  }
  .back-btn{
    position:absolute; right:0;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    color:var(--paper);
  }
  .back-btn svg{ width:22px;height:22px; }
  .panel-header h1{
    flex:1;
    text-align:center;
    font-size:19px;
    font-weight:700;
    margin:0;
  }
  .panel-desc{
    font-size:14px;
    line-height:1.7;
    color:#aebdb5;
    margin:0 0 28px;
  }
  .field{ margin-bottom:22px; }
  .field-label{
    font-size:14px;
    font-weight:600;
    color:var(--paper);
    margin:0 0 10px;
  }
  .dropdown{ position:relative; }
  .dropdown-trigger{
    width:100%;
    background:var(--field-bg);
    border:1.5px solid var(--panel-border);
    border-radius:12px;
    padding:15px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--paper);
    font-size:15px;
    font-weight:600;
    transition:border-color .15s ease;
  }
  .dropdown.open .dropdown-trigger{
    border-color:var(--gold);
  }
  .dropdown-trigger .chev{
    width:16px;height:16px;
    color:#9fb0a6;
    transition:transform .2s ease;
    flex:none;
  }
  .dropdown.open .dropdown-trigger .chev{ transform:rotate(180deg); }
  .dropdown-trigger .current.placeholder{ color:#6c7d73; font-weight:500; }

  .dropdown-list{
    margin-top:8px;
    border:1.5px solid var(--gold);
    border-radius:12px;
    overflow:hidden;
    background:#1c2820;
    max-height:0;
    opacity:0;
    transition:max-height .25s ease, opacity .2s ease;
  }
  .dropdown.open .dropdown-list{
    max-height:260px;
    opacity:1;
  }
  .dropdown-option{
    width:100%;
    text-align:right;
    padding:14px 16px;
    font-size:15px;
    font-weight:600;
    color:#dde7e1;
    background:transparent;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .dropdown-option:last-child{ border-bottom:none; }
  .dropdown-option.selected{ color:var(--gold); }
  .dropdown-option:active{ background:rgba(255,255,255,0.05); }

  .panel-save{
    width:100%;
    background:var(--gold);
    color:#231708;
    font-weight:700;
    font-size:16px;
    padding:16px;
    border-radius:14px;
    margin-top:8px;
    transition:transform .15s ease, opacity .2s ease;
  }
  .panel-save:active{ transform:scale(0.98); }
  .panel-save:disabled{ opacity:0.45; pointer-events:none; }
</style>
</head>
<body>

<div class="screen">

  <div class="style-bar" id="styleBar">
    <div>
      <span class="label">הסגנון שלי</span>
      <span class="value empty" id="styleValue">לא נבחר</span>
    </div>
    <button class="edit-btn" id="editStyleBtn" aria-label="עריכת סגנון">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
      </svg>
    </button>
  </div>

  <div class="banner" id="banner">
    <span class="dot"></span>
    <span>בחר/י סגנון כדי לקבל הצעות</span>
  </div>

  <div class="context" id="context">
    <span class="snippet">טוען פרטי הפוסט…</span>
  </div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-header">
        <button class="nav-arrow" id="prevBtn" aria-label="הצעה קודמת" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <span class="card-title" id="forUser">מכין/ה הצעה…</span>
        <button class="nav-arrow" id="nextBtn" aria-label="הצעה הבאה" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>
      <p class="quote-text" id="quoteText">
        <span class="skeleton" style="width:100%;display:block;margin-bottom:8px;"></span>
        <span class="skeleton" style="width:80%;display:block;"></span>
      </p>
    </div>
  </div>

  <div class="actions">
    <button class="btn-accept" id="acceptBtn" disabled>
      <span id="acceptLabel">העתק ופתח</span>
    </button>
    <p class="hint">הדבק תגובה אחרי פתיחה</p>
  </div>
</div>

<!-- full-screen style panel -->
<div class="panel" id="panel">
  <div class="panel-inner">
    <div class="panel-header">
      <button class="back-btn" id="backBtn" aria-label="חזרה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 id="panelTitle">סגנון תגובה</h1>
    </div>
    <p class="panel-desc">הצעות התגובה נוצרות באופן אוטומטי בעזרת הפרמטרים האישיים וההעדפות שלך:</p>

    <div class="field">
      <p class="field-label">מגדר</p>
      <div class="dropdown" id="genderDropdown">
        <button class="dropdown-trigger" type="button">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          <span class="current placeholder" id="genderCurrent">בחר/י</span>
        </button>
        <div class="dropdown-list" id="genderList">
          <button class="dropdown-option" data-value="male">זכר</button>
          <button class="dropdown-option" data-value="female">נקבה</button>
        </div>
      </div>
    </div>

    <div class="field">
      <p class="field-label">סגנון תגובה</p>
      <div class="dropdown" id="toneDropdown">
        <button class="dropdown-trigger" type="button">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          <span class="current placeholder" id="toneCurrent">בחר/י</span>
        </button>
        <div class="dropdown-list" id="toneList">
          <button class="dropdown-option" data-value="cynical">ציני</button>
          <button class="dropdown-option" data-value="emotional">רגשי</button>
          <button class="dropdown-option" data-value="formal">ממלכתי</button>
          <button class="dropdown-option" data-value="aggressive">אגרסיבי</button>
        </div>
      </div>
    </div>

    <button class="panel-save" id="panelSaveBtn">שמירה</button>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || 'demo-token';

const MOCK_CONTEXT = {
  source: 'x.com/askdani__real/status/2066019756168118524?s=20',
  snippet: 'התחילה עונת ה"אם תצביעו לשמאל אז שערי הגיהנום ייפתחו"\n\nאז כדאי להיזכר שבבחירות הקודמות הם הפחידו אותנו שאם נצביע לשמאל אז מחבלים על טנדרים יסעו חופשי ברחבי ישראל.',
  // The real, canonical URL of the post. Your backend should return this
  // alongside the suggestion — it's what triggers the OS-level handoff to
  // the native app (Universal Links / App Links) when one is installed.
  postUrl: 'https://x.com/askdani__real/status/2066019756168118524?s=20'
};

const SUGGESTIONS_BY_TONE = {
  cynical:   ["מזל טוב! עוד קצת ותתחילו לדבר על \u05D4'שינוי העולם' כמו כולם.", "Series A, איזה חידוש. בהצלחה עם ה-burn rate החדש."],
  emotional: ["כל הכבוד! ניכר כמה עבודה ואהבה הושקעו כאן — מתרגש/ת בשבילכם.", "קראתי את זה ופשוט שמח/ה. מגיע לכם כל מילה טובה."],
  formal:    ["ברכות חמות על ההשקעה המשמעותית והישג זה לחברה ולצוות.", "מבקש/ת להעביר ברכות על ההצלחה. התמדה זו ראויה להערכה."],
  aggressive:[
    "הפחדות ריקות מתוכן של מי שהביאו עלינו את האסון! בושה של ממשלה.",
    "כל מה שהזהרתם מפניו קרה בגללכם. אתם ההפקרה האמיתית!",
    "איפה הביטחון שהבטחתם? קיבלנו 7 באוקטובר ועכשיו אתם בורחים מאחריות.",
    "לפרק פינת זיכרון כדי לא לראות את המחדל? אתם מנותקים מהמציאות ומהעם."
  ]
};

let suggestionIndex = 0;

function fetchContext(){
  return new Promise(resolve => setTimeout(() => resolve(MOCK_CONTEXT), 450));
}

function fetchSuggestion(tone, index){
  const pool = SUGGESTIONS_BY_TONE[tone] || SUGGESTIONS_BY_TONE.emotional;
  return new Promise(resolve => setTimeout(() => resolve(pool[index % pool.length]), 600));
}

function getStyle(){
  const match = document.cookie.match(/(?:^|;\s*)style=([^;]+)/);
  if(!match) return null;
  try{ return JSON.parse(decodeURIComponent(match[1])); }catch(e){ return null; }
}

function setStyle(style){
  const maxAge = 60 * 60 * 24 * 365 * 2;
  document.cookie = `style=${encodeURIComponent(JSON.stringify(style))}; max-age=${maxAge}; path=/; SameSite=Lax`;
}

const GENDER_LABEL = { male:'זכר', female:'נקבה' };
const TONE_LABEL = { cynical:'ציני', emotional:'רגשי', formal:'ממלכתי', aggressive:'אגרסיבי' };

const els = {
  styleValue: document.getElementById('styleValue'),
  editStyleBtn: document.getElementById('editStyleBtn'),
  banner: document.getElementById('banner'),
  context: document.getElementById('context'),
  card: document.getElementById('card'),
  quoteText: document.getElementById('quoteText'),
  forUser: document.getElementById('forUser'),
  acceptBtn: document.getElementById('acceptBtn'),
  acceptLabel: document.getElementById('acceptLabel'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  panel: document.getElementById('panel'),
  backBtn: document.getElementById('backBtn'),
  panelSaveBtn: document.getElementById('panelSaveBtn'),
  genderDropdown: document.getElementById('genderDropdown'),
  genderCurrent: document.getElementById('genderCurrent'),
  genderList: document.getElementById('genderList'),
  toneDropdown: document.getElementById('toneDropdown'),
  toneCurrent: document.getElementById('toneCurrent'),
  toneList: document.getElementById('toneList'),
};

let currentText = '';
let currentStyle = getStyle();
let draft = { gender:null, tone:null };

function renderStyleBar(){
  if(currentStyle){
    els.styleValue.textContent = `${GENDER_LABEL[currentStyle.gender]} · ${TONE_LABEL[currentStyle.tone]}`;
    els.styleValue.classList.remove('empty');
    els.banner.classList.remove('show');
  } else {
    els.styleValue.textContent = 'לא נבחר';
    els.styleValue.classList.add('empty');
    els.banner.classList.add('show');
  }
}

function setLocked(locked){
  els.card.classList.toggle('locked', locked);
  els.acceptBtn.disabled = locked;
  els.prevBtn.disabled = locked;
  els.nextBtn.disabled = locked;
  if(locked){
    els.quoteText.classList.add('placeholder');
    els.quoteText.textContent = 'בחר/י סגנון למעלה כדי לראות כאן הצעת תגובה.';
    els.forUser.textContent = '—';
  } else {
    els.quoteText.classList.remove('placeholder');
  }
}

function renderContext(ctx){
  els.context.innerHTML = `<span class="snippet">${ctx.snippet}</span>`;
}

async function loadSuggestion(index, animate){
  if(!currentStyle) return;

  if(animate){
    els.card.classList.add('swap-out');
    await new Promise(r => setTimeout(r, 220));
  }

  els.acceptBtn.disabled = true;
  els.prevBtn.disabled = true;
  els.nextBtn.disabled = true;
  els.acceptBtn.classList.remove('done');
  els.acceptLabel.textContent = 'העתק ופתח';

  if(animate){
    els.quoteText.innerHTML = `<span class="skeleton" style="width:100%;display:block;margin-bottom:8px;"></span><span class="skeleton" style="width:80%;display:block;"></span>`;
    els.card.classList.remove('swap-out');
    els.card.classList.add('swap-in');
    requestAnimationFrame(() => els.card.classList.remove('swap-in'));
  }

  const text = await fetchSuggestion(currentStyle.tone, index);
  const options = SUGGESTIONS_BY_TONE[currentStyle.tone] || SUGGESTIONS_BY_TONE.emotional;

  els.quoteText.textContent = text;
  els.forUser.textContent = `התגובה שלך: ${(index % options.length) + 1}`;

  els.acceptBtn.disabled = false;
  els.prevBtn.disabled = false;
  els.nextBtn.disabled = false;
  currentText = text;
}

async function refreshUI(animateOnLoad){
  renderStyleBar();
  if(currentStyle){
    setLocked(false);
    await loadSuggestion(suggestionIndex, animateOnLoad);
  } else {
    setLocked(true);
  }
}

/* ---- dropdowns ---- */

function closeAllDropdowns(except){
  [els.genderDropdown, els.toneDropdown].forEach(d => { if(d !== except) d.classList.remove('open'); });
}

function wireDropdown(dropdown, listEl, currentEl, labels){
  dropdown.querySelector('.dropdown-trigger').addEventListener('click', () => {
    const willOpen = !dropdown.classList.contains('open');
    closeAllDropdowns(dropdown);
    dropdown.classList.toggle('open', willOpen);
  });
  listEl.querySelectorAll('.dropdown-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const value = opt.dataset.value;
      listEl.querySelectorAll('.dropdown-option').forEach(o => o.classList.toggle('selected', o === opt));
      currentEl.textContent = labels[value];
      currentEl.classList.remove('placeholder');
      dropdown.classList.remove('open');
      dropdown.dataset.value = value;
      updateSaveState();
    });
  });
}
wireDropdown(els.genderDropdown, els.genderList, els.genderCurrent, GENDER_LABEL);
wireDropdown(els.toneDropdown, els.toneList, els.toneCurrent, TONE_LABEL);

function updateSaveState(){
  const ok = !!els.genderDropdown.dataset.value && !!els.toneDropdown.dataset.value;
  els.panelSaveBtn.disabled = !ok;
}

function openPanel(){
  document.title = currentStyle ? 'עריכת סגנון' : 'בחירת סגנון';
  closeAllDropdowns(null);

  const g = currentStyle ? currentStyle.gender : null;
  const t = currentStyle ? currentStyle.tone : null;

  els.genderDropdown.dataset.value = g || '';
  els.genderCurrent.textContent = g ? GENDER_LABEL[g] : 'בחר/י';
  els.genderCurrent.classList.toggle('placeholder', !g);
  els.genderList.querySelectorAll('.dropdown-option').forEach(o => o.classList.toggle('selected', o.dataset.value === g));

  els.toneDropdown.dataset.value = t || '';
  els.toneCurrent.textContent = t ? TONE_LABEL[t] : 'בחר/י';
  els.toneCurrent.classList.toggle('placeholder', !t);
  els.toneList.querySelectorAll('.dropdown-option').forEach(o => o.classList.toggle('selected', o.dataset.value === t));

  updateSaveState();
  els.panel.classList.add('open');
}
function closePanel(){ els.panel.classList.remove('open'); closeAllDropdowns(null); }

els.editStyleBtn.addEventListener('click', openPanel);
els.banner.addEventListener('click', openPanel);
els.backBtn.addEventListener('click', closePanel);

els.panelSaveBtn.addEventListener('click', async () => {
  const gender = els.genderDropdown.dataset.value;
  const tone = els.toneDropdown.dataset.value;
  if(!gender || !tone) return;
  currentStyle = { gender, tone };
  setStyle(currentStyle);
  closePanel();
  suggestionIndex = 0;
  await refreshUI(true);
});

/* ---- copy / retry / navigation ---- */

function pool(){
  return SUGGESTIONS_BY_TONE[currentStyle.tone] || SUGGESTIONS_BY_TONE.emotional;
}

async function navigate(direction){
  if(!currentStyle || els.nextBtn.disabled) return;
  const len = pool().length;
  suggestionIndex = ((suggestionIndex + direction) % len + len) % len;
  await loadSuggestion(suggestionIndex, true);
}

els.prevBtn.addEventListener('click', () => navigate(-1));
els.nextBtn.addEventListener('click', () => navigate(1));

document.addEventListener('keydown', (e) => {
  if(els.panel.classList.contains('open')) return;
  if(e.key === 'ArrowRight') navigate(1);
  else if(e.key === 'ArrowLeft') navigate(-1);
});

let touchStartX = null;
els.card.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
els.card.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  touchStartX = null;
  const SWIPE_THRESHOLD = 40;
  if(dx <= -SWIPE_THRESHOLD) navigate(-1);
  else if(dx >= SWIPE_THRESHOLD) navigate(1);
});

els.acceptBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(currentText);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = currentText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  els.acceptBtn.classList.add('done');
  els.acceptLabel.textContent = 'הועתק ✓';

  // Navigate to the real post URL right away, in the same user gesture.
  // No device/app detection needed: if the platform's app is installed and
  // registered for Universal Links (iOS) / App Links (Android), the OS
  // opens the app directly; otherwise it falls through to the browser.
  // This must NOT be wrapped in setTimeout — delaying it can break iOS's
  // requirement that the navigation stay tied to the user's tap.
  if(MOCK_CONTEXT.postUrl){
    window.location.href = MOCK_CONTEXT.postUrl;
  }
});

/* ---- init ---- */

async function init(){
  const ctx = await fetchContext();
  renderContext(ctx);
  await refreshUI(false);
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
